# One command runs the whole stack: `docker compose up --build`, then open http://localhost:3000.
# Every service reads the root .env (copy .env.example). Without it, everything runs in mock mode.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calldesk
      POSTGRES_USER: ${DATABASE_USERNAME:-calldesk}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-calldesk}
    volumes:
      - calldesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-calldesk} -d calldesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/calldesk
      DATABASE_USERNAME: ${DATABASE_USERNAME:-calldesk}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-calldesk}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      args:
        # The browser talks to the backend directly, so this must be reachable from your machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      # Server-side rendering runs inside the container, so it reaches the backend over the compose network.
      CALLDESK_API_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  calldesk-postgres:
